name: cupel scan

# Your repository holds a pointer to this workflow; this file is the implementation.
#
# WHY IT IS SPLIT THAT WAY. The obvious design puts the whole job in your own
# `.github/workflows/cupel.yml`: the checkout, the install, and an exact engine version. All
# three are ours to maintain, and all three end up in a file only you can edit — so every
# engine release leaves you on whatever version you installed with, and the only way forward
# is a pull request in your repository for a change that is really ours.
#
# Inverting it fixes that for good. Your file names this workflow and nothing else, so the
# version, the checkout pin and every future change live here, where we can ship them. Your
# file is written once and does not need touching again.
#
# WHAT YOUR WORKFLOW MUST GRANT, and what each is for:
#
#   contents: read    the engine analyses your checked-out source
#   id-token: write   findings are pushed with a GitHub-signed assertion naming the
#                     repository, so there is no long-lived credential in your CI at all
#
# YOUR PERMISSIONS ARE A CEILING THIS FILE CANNOT RAISE. GitHub intersects the two, so nothing
# added here can widen what you granted. That is worth stating rather than relying on: the
# four lines in your own workflow are the complete extent of what this integration can reach,
# and you can confirm that without reading this file.
#
# WHAT IT DELIBERATELY DOES NOT ASK FOR: `contents: write`, `pull-requests: write`, and access
# to your secrets. cupel never writes to your repository, and this workflow must not become
# the exception that makes that claim untrue.

on:
  workflow_call:
    inputs:
      cli-version:
        description: >-
          Pin a specific @cupel-sh/cli version instead of the one this workflow ships. Leave it
          unset to receive engine updates automatically, which is the point of calling this
          workflow rather than inlining it. Set it if your organisation requires a determinable
          version of every tool that runs in CI.
        required: false
        type: string
      working-directory:
        description: Directory to scan, for a repository whose project is not at the root.
        required: false
        type: string
        default: "."
      entry:
        description: >-
          The file your application starts from, when cupel cannot work it out. It looks for
          `main`, `bin` or `exports` in package.json, an index.js, a `start` script and a
          Procfile, the module scripts a Vite app's index.html loads, and the route files of
          Astro, Next, SvelteKit and Nuxt. With nothing to start from, cupel analyses no
          application code and every finding is potentially reachable, not analysed, which is
          honest and not much use. Point this at the file your start script runs. One per line
          for an app with several roots.
        required: false
        type: string
      exclude:
        description: >-
          Files to leave out of the source-file count, in .gitignore syntax, one pattern per
          line. The count already follows your .gitignore files and skips dependency and build
          directories; use this (or a .cupelignore file) for anything else. Every file left out
          is still listed, with the pattern that left it out. It changes what is counted, never
          what the analysis follows.
        required: false
        type: string
      x-go:
        description: >-
          Also scan Go modules, at package level. Off by default while Go support is new, and it
          needs engine 0.14.0 or later: with an older `cli-version` the run fails before anything
          is scanned. The job first makes sure a Go at least as new as any go.mod in the tree asks
          for is on the runner, then downloads the modules (`go mod download`, which fetches and
          verifies them and runs none of their code), because the engine reads them from disk and
          fetches nothing itself.
        required: false
        type: boolean
        default: false
      go-private:
        description: >-
          With `x-go`: the Go modules that must never be sent to a proxy or downloaded, as
          comma-separated module path patterns (GOPRIVATE syntax). The scan names each one it
          could not read. Unset, it is your own organisation's, `github.com/<owner>/*`, in a
          private or internal repository, and none in a public one, whose module paths are
          public already; `none` lets every module go to the public proxy. Any module outside the
          patterns is fetched from proxy.golang.org, which sees its path.
        required: false
        type: string
        default: ""

# Narrowed here as well as by the caller. The intersection means this cannot grant anything,
# but stating it means a repository that grants broadly still runs this job with only what it
# needs.
permissions:
  contents: read
  id-token: write

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit SHA, never by tag: a tag is a pointer its owner can move, and a SHA
      # is the tree. That matters more here than in our own CI, because this runs inside your
      # repository.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A Python project's dependencies are read from its installed environment (`.venv`), the
      # way a Node project's are read from `node_modules` — the engine reads what is installed,
      # never what a manifest merely declares. A checkout has no environment, so one is created
      # here from the project's own lockfile or requirements, with uv. A repository without a
      # Python project skips this step entirely, and a failed install removes the partial
      # environment so the scan reports "no environment" rather than a partial dependency set.
      #
      # `--no-build` IS LOAD-BEARING, and it is why this step can exist at all. Installing a
      # source distribution BUILDS it, which runs `setup.py` or a PEP 517 backend — arbitrary
      # code from one of your dependencies, in your runner, in a job that holds an id-token.
      # cupel never executes the code it analyses, and a workflow that built sdists here would
      # undo that on your side of the wire. `--no-build` means wheels only: nothing a dependency
      # ships gets executed in order to install it.
      #
      # The cost is stated rather than hidden: a dependency that publishes no wheel cannot be
      # installed, the recipe fails, the partial environment is removed, and the scan reports
      # "no environment" — which is the honest outcome and never a narrower dependency set.
      # uv, FROM PyPI AND PINNED BY HASH, RATHER THAN THROUGH A THIRD-PARTY ACTION.
      # `astral-sh/setup-uv` did this until 2026-09-22. The cost was borne by the customer: an
      # organisation that restricts which actions may run had to allowlist a second name, and
      # until it did, every run failed at STARTUP — no job, no scan, no explanation, and a
      # dashboard that could only say the repository had not been scanned (seen on cupel's own
      # test repository, 2026-09-18 to 2026-09-22). One allowlist entry, `cupel-sh/scan-workflow`,
      # is now the whole requirement.
      #
      # THE TRUST IS THE SAME AND THE PROOF IS STRONGER. It is the same uv, published by the same
      # people; what changes is that `--require-hashes` makes pip refuse any bytes but the wheel
      # named below, where a tag on an action can be moved. `--only-binary` keeps the no-build
      # posture the step underneath depends on: nothing is compiled, so nothing of uv's own
      # packaging executes to install it. It goes into a throwaway environment under the runner's
      # temp directory, so the project's own environment is never touched.
      #
      # Bumping uv means replacing the version AND its hashes together; a hash that does not match
      # its version fails the install rather than reaching for whatever is on PyPI today.
      - name: Install uv
        run: |
          set -eu
          python3 -m venv "${RUNNER_TEMP}/uv"
          # Written with printf, not a heredoc: a requirements file is column-sensitive and a
          # heredoc here would carry this block's indentation into it.
          printf '%s\n' \
            'uv==0.12.17 \' \
            '  --hash=sha256:9e25bb39e1674799c408345a6397ebc2c7c719d498be0ce9d935466d36ceacf5 \' \
            '  --hash=sha256:e2bc5ec70e395fc5769becd1b81f6cedc66d23ccaf1392743f0f8c9cfe81b18c' \
            > "${RUNNER_TEMP}/uv-pins.txt"
          "${RUNNER_TEMP}/uv/bin/python" -m pip install --quiet --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r "${RUNNER_TEMP}/uv-pins.txt"
          echo "${RUNNER_TEMP}/uv/bin" >> "${GITHUB_PATH}"

      - name: Install the Python environment
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -u
          # ORDER MATTERS. A Poetry or PDM project normally ALSO has a `pyproject.toml`, so the
          # lockfiles this recipe cannot read are checked BEFORE the pyproject fallback — without
          # that, a Poetry 1.x project falls through to `-r pyproject.toml`, which reads PEP 621
          # `[project.dependencies]` and finds nothing in `[tool.poetry.dependencies]`.
          if [ -f uv.lock ]; then
            recipe="uv sync --frozen --no-build"
          elif [ -f poetry.lock ] || [ -f pdm.lock ] || [ -f Pipfile.lock ]; then
            # NAMED, NOT SILENT. cupel treats any of these lockfiles as proof the directory is
            # a Python project, so the scan calls it one and then finds no installed packages —
            # a dependency set of zero, which reads exactly like a clean one. Say so instead.
            echo "::warning::a Poetry / PDM / Pipenv lockfile is present and this workflow installs with uv, which cannot read it. Install the environment yourself in a step before this job (any `.venv` is read), or the Python half of this scan reports no dependencies."
            exit 0
          elif [ -f requirements.txt ]; then
            recipe="uv venv .venv && uv pip install --python .venv/bin/python --no-build -r requirements.txt"
          elif [ -f pyproject.toml ]; then
            recipe="uv venv .venv && uv pip install --python .venv/bin/python --no-build -r pyproject.toml"
          else
            echo "no Python project here (no uv.lock, requirements.txt or pyproject.toml); skipping"
            exit 0
          fi
          echo "installing the Python environment: $recipe"
          if ! sh -c "$recipe"; then
            rm -rf .venv
            echo "::warning::the Python environment could not be installed; the scan will report it as missing rather than read a partial one"
          fi

      # GO, ONLY WHEN ASKED (`x-go`). The engine reads a Go project the way the go command builds
      # it: `go list`, with the Go on the runner and the module cache, fetching nothing. A checkout
      # alone gives it too little. The runner's module cache is empty, so every third-party module
      # would be missing from the scan (named as a gap, never passed off as clean), and a go.mod
      # whose `go` line is newer than the runner's Go cannot be read at all. These three steps
      # close both, and a caller who leaves `x-go` off runs none of them.
      #
      # GO-PRIVATE FIRST. A module path can itself be confidential, and `go mod download` asks the
      # proxy for every module by path, so the modules it matches are kept off the proxy and are
      # never downloaded; the scan names them as modules it could not read. Unset, in a private
      # or internal repository it is the calling repository's own organisation, in the owner's
      # spelling and in lower case (Go module paths are case-sensitive): an organisation's own
      # module paths are the ones most likely to be private, and a path sent to a public proxy
      # cannot be taken back. Unset in a PUBLIC repository it is none: every module path its
      # go.mod and go.sum name is public already, so there is nothing to withhold, and the
      # organisation's own public modules are read. A repository whose visibility this run cannot
      # tell is treated as private. `none` turns it off. An input that is not a list of module
      # path patterns fails the job here, before anything is fetched.
      #
      # THEN THE NEWEST GO ANY MODULE ASKS FOR, and the runner's Go is only ever replaced by a
      # newer one. Every go.mod and go.work in the tree is read (not those under the directories
      # the go command skips), each for what setup-go would read, its `toolchain` line, else its
      # `go` line. setup-go would install that even when it is OLDER than the runner's own: a
      # `go 1.16` module would get Go 1.16, which the engine refuses (it needs 1.21 or later),
      # although the runner's Go reads that module fine. GOTOOLCHAIN=local, so that asking the
      # runner's version can never download a toolchain.
      - name: Plan the Go steps
        id: go
        if: inputs.x-go
        working-directory: ${{ inputs.working-directory }}
        env:
          CUPEL_GO_PRIVATE: ${{ inputs.go-private }}
          CUPEL_REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -u
          private="$(printf '%s' "$CUPEL_GO_PRIVATE" | sed 's/,,*/,/g; s/^,//; s/,$//')"
          if [ "$private" = none ]; then
            private=""
          elif [ -z "$private" ] && [ "${CUPEL_REPO_PRIVATE:-}" = false ]; then
            echo "go-private is unset and this repository is public: the module paths it names are public already"
          elif [ -z "$private" ]; then
            owner="${GITHUB_REPOSITORY_OWNER}"
            lower="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
            private="github.com/${owner}/*"
            if [ "$lower" != "$owner" ]; then
              private="${private},github.com/${lower}/*"
            fi
          fi
          case "$private" in
            *[!]A-Za-z0-9._~+/*?,[-]*)
              echo "::error::go-private takes module path patterns separated by commas, as GOPRIVATE does (letters, digits, . _ ~ + / - and the glob characters * ? [ ]). Nothing was downloaded."
              exit 1
              ;;
          esac
          echo "private=${private}" >> "${GITHUB_OUTPUT}"
          if [ -n "$private" ]; then
            echo "go-private: ${private} is never sent to a proxy or downloaded"
          else
            echo "go-private: none; every module may be fetched from the public proxy"
          fi

          if ! find . \( -type d \( -name node_modules -o -name vendor -o -name testdata -o -name '_*' -o -name '.?*' \) \) -prune \
              -o -type f \( -name go.mod -o -name go.work \) -print > "${RUNNER_TEMP}/cupel-go-files"; then
            echo "::warning::part of the tree could not be searched for go.mod files"
          fi
          wants=""
          while IFS= read -r f; do
            v="$(sed -n 's/^toolchain[[:space:]]\{1,\}go\([0-9][0-9A-Za-z.]*\).*/\1/p' "$f" | head -n 1)"
            if [ -z "$v" ]; then
              v="$(sed -n 's/^go[[:space:]]\{1,\}\([0-9][0-9A-Za-z.]*\).*/\1/p' "$f" | head -n 1)"
            fi
            if [ -n "$v" ]; then
              echo "${f}: Go ${v}"
              wants="$(printf '%s\n%s\n' "$wants" "$v" | sort -V | tail -n 1)"
            fi
          done < "${RUNNER_TEMP}/cupel-go-files"
          has="$(GOTOOLCHAIN=local go env GOVERSION 2>/dev/null | sed 's/^go//')"
          newest="$(printf '%s\n%s\n' "$has" "$wants" | sort -V | tail -n 1)"
          if [ -n "$wants" ] && [ "$newest" != "$has" ]; then
            echo "the newest Go asked for is ${wants} and the runner has ${has:-none}: setting up ${wants}"
            echo "version=${wants}" >> "${GITHUB_OUTPUT}"
          else
            echo "the newest Go asked for is ${wants:-(none)} and the runner has ${has}: using the runner's"
          fi

      # Pinned by commit SHA, like checkout, and GitHub's own, so an organisation that allows only
      # GitHub's actions and this workflow needs no new entry. `cache: false`: every module is
      # downloaded and checked in THIS run, and a cache restored from an earlier run would be
      # bytes this run never verified. If it fails (a `go` line naming no release, a download
      # that does not arrive), the scan still runs with the runner's Go and names what that Go
      # could not read, rather than the whole job failing with no scan.
      - name: Set up Go
        if: steps.go.outputs.version != ''
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      # `go mod download` FETCHES AND VERIFIES; IT RUNS NOTHING. A module is a zip checked against
      # go.sum and the public checksum database, and no dependency code executes: the property
      # the Python step keeps with `--no-build`. It runs in every directory holding a go.mod
      # except those the go command itself skips (`vendor`, `testdata`, names beginning `_` or
      # `.`) and `node_modules`, so a repository of several modules has every one read. A module
      # with a vendor/modules.txt is built from vendor/, so nothing is fetched for it.
      #
      # FROM THE PUBLIC PROXY, AND NOTHING ELSE. The step can reach three hosts: proxy.golang.org,
      # the storage it redirects a large module to (storage.googleapis.com; genproto and the
      # Google API modules go that way), and sum.golang.org. Every other connection is sent to a
      # proxy that is not there (127.0.0.1:9) and fails on the spot, and there is no
      # version-control fallback (GOVCS=*:off), so no git runs against a host a dependency names.
      # A module go-private matches is GOPRIVATE, GONOPROXY and GONOSUMDB here: never asked of the
      # proxy or of the checksum database, and, with every other host closed, never fetched from
      # anywhere, not even looked up on its own domain. Nor can any other private module be
      # fetched: this workflow holds none of your credentials. The scan names each as missing
      # rather than reading around it. GOTOOLCHAIN=local: a module whose `go` line is newer than
      # the Go chosen above fails here, visibly, instead of fetching a toolchain, and the scan
      # names that root.
      #
      # ONE MODULE THAT CANNOT BE FETCHED MUST NOT COST ALL THE OTHERS. A plain `go mod download`
      # reads the whole module graph first and stops at the first module it cannot resolve, before
      # it has fetched a single module, so one private dependency would leave every public one
      # missing too. When it fails, the build list is read as the go command reads it (`go list -m
      # -e all`) and every module it could resolve is fetched by name; what it could not resolve,
      # or a local `replace` provides, is left out.
      #
      # A failure warns and the scan goes on, as the Python step's does: the engine reports what
      # it could not read, so a failed download is a named gap, never a narrower clean result. One
      # retry, because the proxy's transient errors are real (a stream reset has been seen part
      # way through a large repository) and a second attempt fetches only what the first did not.
      # A download that runs long is cut at ten minutes and the scan still runs, on what arrived:
      # the job's twenty minutes are the scan's too, and a scan with named gaps is worth more than
      # a job killed with no scan at all.
      - name: Download the Go modules
        if: inputs.x-go
        timeout-minutes: 10
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOVCS: "*:off"
          GIT_TERMINAL_PROMPT: "0"
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: proxy.golang.org,storage.googleapis.com,sum.golang.org
          GOPRIVATE: ${{ steps.go.outputs.private }}
          GONOPROXY: ${{ steps.go.outputs.private }}
          GONOSUMDB: ${{ steps.go.outputs.private }}
        run: |
          set -u
          if ! command -v go >/dev/null 2>&1; then
            echo "::warning::no Go on the runner; the scan reports every Go project as not read"
            exit 0
          fi
          if ! find . \( -type d \( -name node_modules -o -name vendor -o -name testdata -o -name '_*' -o -name '.?*' \) \) -prune \
              -o -type f -name go.mod -print > "${RUNNER_TEMP}/cupel-go-modules"; then
            echo "::warning::part of the tree could not be searched for go.mod files; a module there is not downloaded"
          fi
          if [ ! -s "${RUNNER_TEMP}/cupel-go-modules" ]; then
            echo "no go.mod here; nothing to download"
            exit 0
          fi
          go version || true
          # The build list, less the main module, what could not be resolved, and local replacements.
          fetchable='{{if not .Main}}{{with .Replace}}{{if and .Version (not .Error)}}{{.Path}}@{{.Version}}{{end}}{{else}}{{if not .Error}}{{.Path}}@{{.Version}}{{end}}{{end}}{{end}}'
          while IFS= read -r mod; do
            dir="$(dirname "$mod")"
            if [ -f "${dir}/vendor/modules.txt" ]; then
              echo "${dir}: vendored, read from vendor/"
              continue
            fi
            echo "${dir}: go mod download"
            if (cd "$dir" && go mod download) || (cd "$dir" && go mod download); then
              continue
            fi
            echo "${dir}: some modules cannot be fetched; fetching the others by name"
            if (cd "$dir" && go list -m -e -f "$fetchable" all) > "${RUNNER_TEMP}/cupel-go-all"; then
              sed '/^$/d' "${RUNNER_TEMP}/cupel-go-all" > "${RUNNER_TEMP}/cupel-go-fetchable"
              if [ ! -s "${RUNNER_TEMP}/cupel-go-fetchable" ] \
                || (cd "$dir" && xargs go mod download < "${RUNNER_TEMP}/cupel-go-fetchable"); then
                echo "::warning::${dir}: some modules could not be fetched (a go-private module never is) and the rest were; the scan names the missing ones"
                continue
              fi
            fi
            echo "::warning::go mod download could not fetch everything in ${dir}; the scan names what it could not read there"
          done < "${RUNNER_TEMP}/cupel-go-modules"

      - name: Scan and push findings
        working-directory: ${{ inputs.working-directory }}
        env:
          # The default is the version this workflow ships, and bumping it here is the whole of
          # an engine upgrade for everyone on the moving tag. The input overrides it, so
          # pinning costs you nothing but a line.
          CUPEL_CLI_VERSION: ${{ inputs.cli-version || '0.13.0' }}
          # THROUGH THE ENVIRONMENT, NOT INTO THE SCRIPT. `${{ }}` substitutes before bash sees
          # the line, so an input interpolated directly into `run:` is a shell injection in your
          # repository, executed with your job's permissions. Read as a variable it is data.
          CUPEL_ENTRY: ${{ inputs.entry }}
          CUPEL_EXCLUDE: ${{ inputs.exclude }}
          CUPEL_X_GO: ${{ inputs.x-go }}
          # The same go-private patterns, so every go command this job runs is told the same
          # thing. The engine fetches nothing whatever they say: it runs the go command with
          # GOPROXY=off and replaces GONOPROXY with a pattern that matches nothing.
          GOPRIVATE: ${{ steps.go.outputs.private }}
          GONOPROXY: ${{ steps.go.outputs.private }}
          GONOSUMDB: ${{ steps.go.outputs.private }}
        run: |
          set -- scan
          # One entry per line, empty lines skipped. `--entry` is repeatable and the engine
          # unions what you give it with anything it found by itself, so listing a root never
          # narrows the scan.
          while IFS= read -r line; do
            [ -n "$line" ] && set -- "$@" --entry "$line"
          done <<< "$CUPEL_ENTRY"
          # One pattern per line, the same way. Passed only when given, so a pinned older
          # engine that does not know `--exclude` runs as it did.
          while IFS= read -r line; do
            [ -n "$line" ] && set -- "$@" --exclude "$line"
          done <<< "$CUPEL_EXCLUDE"
          # GO FROM ENGINE 0.14.0 ONLY, the first that judges the standard library by the oldest Go
          # your go.mod allows and names every module it could not read. An older engine can call
          # a Go dependency clean when it is not, so `x-go` with an older `cli-version` stops here,
          # before anything is scanned: a failed run is honest, and a result that looks complete
          # and is not is the one outcome this must never produce. A range or a tag cannot be
          # checked, so it is refused the same way; name an exact version.
          if [ "$CUPEL_X_GO" = "true" ]; then
            if ! printf '%s\n' "$CUPEL_CLI_VERSION" | awk -F. '
                /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/ { ok = ($1 > 0 || $2 >= 14) }
                END { exit (ok ? 0 : 1) }'; then
              echo "::error::x-go needs @cupel-sh/cli 0.14.0 or later, as an exact version, and this run was given '${CUPEL_CLI_VERSION}'. Remove the cli-version pin or raise it, or turn x-go off."
              exit 1
            fi
            set -- "$@" --x-go
          fi
          set -- "$@" --push
          npx --yes "@cupel-sh/cli@${CUPEL_CLI_VERSION}" "$@"
