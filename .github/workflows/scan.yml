name: cupel scan

# Your repository holds a pointer to this workflow; this file is the implementation.
#
# WHY IT IS SPLIT THAT WAY. The obvious design puts the whole job in your own
# `.github/workflows/cupel.yml`: the checkout, the install, and an exact engine version. All
# three are ours to maintain, and all three end up in a file only you can edit — so every
# engine release leaves you on whatever version you installed with, and the only way forward
# is a pull request in your repository for a change that is really ours.
#
# Inverting it fixes that for good. Your file names this workflow and nothing else, so the
# version, the checkout pin and every future change live here, where we can ship them. Your
# file is written once and does not need touching again.
#
# WHAT YOUR WORKFLOW MUST GRANT, and what each is for:
#
#   contents: read    the engine analyses your checked-out source
#   id-token: write   findings are pushed with a GitHub-signed assertion naming the
#                     repository, so there is no long-lived credential in your CI at all
#
# YOUR PERMISSIONS ARE A CEILING THIS FILE CANNOT RAISE. GitHub intersects the two, so nothing
# added here can widen what you granted. That is worth stating rather than relying on: the
# four lines in your own workflow are the complete extent of what this integration can reach,
# and you can confirm that without reading this file.
#
# WHAT IT DELIBERATELY DOES NOT ASK FOR: `contents: write`, `pull-requests: write`, and access
# to your secrets. cupel never writes to your repository, and this workflow must not become
# the exception that makes that claim untrue.

on:
  workflow_call:
    inputs:
      cli-version:
        description: >-
          Pin a specific @cupel-sh/cli version instead of the one this workflow ships. Leave it
          unset to receive engine updates automatically, which is the point of calling this
          workflow rather than inlining it. Set it if your organisation requires a determinable
          version of every tool that runs in CI.
        required: false
        type: string
      working-directory:
        description: Directory to scan, for a repository whose project is not at the root.
        required: false
        type: string
        default: "."
      entry:
        description: >-
          The file your application starts from, when cupel cannot work it out. It looks for
          `main`, `bin` or `exports` in package.json, an index.js, a `start` script and a
          Procfile, the module scripts a Vite app's index.html loads, and the route files of
          Astro, Next, SvelteKit and Nuxt. With nothing to start from, cupel analyses no
          application code and every finding is potentially reachable, not analysed, which is
          honest and not much use. Point this at the file your start script runs. One per line
          for an app with several roots.
        required: false
        type: string
      exclude:
        description: >-
          Files to leave out of the source-file count, in .gitignore syntax, one pattern per
          line. The count already follows your .gitignore files and skips dependency and build
          directories; use this (or a .cupelignore file) for anything else. Every file left out
          is still listed, with the pattern that left it out. It changes what is counted, never
          what the analysis follows.
        required: false
        type: string

# Narrowed here as well as by the caller. The intersection means this cannot grant anything,
# but stating it means a repository that grants broadly still runs this job with only what it
# needs.
permissions:
  contents: read
  id-token: write

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit SHA, never by tag: a tag is a pointer its owner can move, and a SHA
      # is the tree. That matters more here than in our own CI, because this runs inside your
      # repository.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A Python project's dependencies are read from its installed environment (`.venv`), the
      # way a Node project's are read from `node_modules` — the engine reads what is installed,
      # never what a manifest merely declares. A checkout has no environment, so one is created
      # here from the project's own lockfile or requirements, with uv. A repository without a
      # Python project skips this step entirely, and a failed install removes the partial
      # environment so the scan reports "no environment" rather than a partial dependency set.
      #
      # `--no-build` IS LOAD-BEARING, and it is why this step can exist at all. Installing a
      # source distribution BUILDS it, which runs `setup.py` or a PEP 517 backend — arbitrary
      # code from one of your dependencies, in your runner, in a job that holds an id-token.
      # cupel never executes the code it analyses, and a workflow that built sdists here would
      # undo that on your side of the wire. `--no-build` means wheels only: nothing a dependency
      # ships gets executed in order to install it.
      #
      # The cost is stated rather than hidden: a dependency that publishes no wheel cannot be
      # installed, the recipe fails, the partial environment is removed, and the scan reports
      # "no environment" — which is the honest outcome and never a narrower dependency set.
      # uv, FROM PyPI AND PINNED BY HASH, RATHER THAN THROUGH A THIRD-PARTY ACTION.
      # `astral-sh/setup-uv` did this until 2026-09-22. The cost was borne by the customer: an
      # organisation that restricts which actions may run had to allowlist a second name, and
      # until it did, every run failed at STARTUP — no job, no scan, no explanation, and a
      # dashboard that could only say the repository had not been scanned (seen on cupel's own
      # test repository, 2026-09-18 to 2026-09-22). One allowlist entry, `cupel-sh/scan-workflow`,
      # is now the whole requirement.
      #
      # THE TRUST IS THE SAME AND THE PROOF IS STRONGER. It is the same uv, published by the same
      # people; what changes is that `--require-hashes` makes pip refuse any bytes but the wheel
      # named below, where a tag on an action can be moved. `--only-binary` keeps the no-build
      # posture the step underneath depends on: nothing is compiled, so nothing of uv's own
      # packaging executes to install it. It goes into a throwaway environment under the runner's
      # temp directory, so the project's own environment is never touched.
      #
      # Bumping uv means replacing the version AND its hashes together; a hash that does not match
      # its version fails the install rather than reaching for whatever is on PyPI today.
      - name: Install uv
        run: |
          set -eu
          python3 -m venv "${RUNNER_TEMP}/uv"
          # Written with printf, not a heredoc: a requirements file is column-sensitive and a
          # heredoc here would carry this block's indentation into it.
          printf '%s\n' \
            'uv==0.12.17 \' \
            '  --hash=sha256:9e25bb39e1674799c408345a6397ebc2c7c719d498be0ce9d935466d36ceacf5 \' \
            '  --hash=sha256:e2bc5ec70e395fc5769becd1b81f6cedc66d23ccaf1392743f0f8c9cfe81b18c' \
            > "${RUNNER_TEMP}/uv-pins.txt"
          "${RUNNER_TEMP}/uv/bin/python" -m pip install --quiet --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r "${RUNNER_TEMP}/uv-pins.txt"
          echo "${RUNNER_TEMP}/uv/bin" >> "${GITHUB_PATH}"

      - name: Install the Python environment
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -u
          # ORDER MATTERS. A Poetry or PDM project normally ALSO has a `pyproject.toml`, so the
          # lockfiles this recipe cannot read are checked BEFORE the pyproject fallback — without
          # that, a Poetry 1.x project falls through to `-r pyproject.toml`, which reads PEP 621
          # `[project.dependencies]` and finds nothing in `[tool.poetry.dependencies]`.
          if [ -f uv.lock ]; then
            recipe="uv sync --frozen --no-build"
          elif [ -f poetry.lock ] || [ -f pdm.lock ] || [ -f Pipfile.lock ]; then
            # NAMED, NOT SILENT. cupel treats any of these lockfiles as proof the directory is
            # a Python project, so the scan calls it one and then finds no installed packages —
            # a dependency set of zero, which reads exactly like a clean one. Say so instead.
            echo "::warning::a Poetry / PDM / Pipenv lockfile is present and this workflow installs with uv, which cannot read it. Install the environment yourself in a step before this job (any `.venv` is read), or the Python half of this scan reports no dependencies."
            exit 0
          elif [ -f requirements.txt ]; then
            recipe="uv venv .venv && uv pip install --python .venv/bin/python --no-build -r requirements.txt"
          elif [ -f pyproject.toml ]; then
            recipe="uv venv .venv && uv pip install --python .venv/bin/python --no-build -r pyproject.toml"
          else
            echo "no Python project here (no uv.lock, requirements.txt or pyproject.toml); skipping"
            exit 0
          fi
          echo "installing the Python environment: $recipe"
          if ! sh -c "$recipe"; then
            rm -rf .venv
            echo "::warning::the Python environment could not be installed; the scan will report it as missing rather than read a partial one"
          fi

      - name: Scan and push findings
        working-directory: ${{ inputs.working-directory }}
        env:
          # The default is the version this workflow ships, and bumping it here is the whole of
          # an engine upgrade for everyone on the moving tag. The input overrides it, so
          # pinning costs you nothing but a line.
          CUPEL_CLI_VERSION: ${{ inputs.cli-version || '0.12.0' }}
          # THROUGH THE ENVIRONMENT, NOT INTO THE SCRIPT. `${{ }}` substitutes before bash sees
          # the line, so an input interpolated directly into `run:` is a shell injection in your
          # repository, executed with your job's permissions. Read as a variable it is data.
          CUPEL_ENTRY: ${{ inputs.entry }}
          CUPEL_EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -- scan
          # One entry per line, empty lines skipped. `--entry` is repeatable and the engine
          # unions what you give it with anything it found by itself, so listing a root never
          # narrows the scan.
          while IFS= read -r line; do
            [ -n "$line" ] && set -- "$@" --entry "$line"
          done <<< "$CUPEL_ENTRY"
          # One pattern per line, the same way. Passed only when given, so a pinned older
          # engine that does not know `--exclude` runs as it did.
          while IFS= read -r line; do
            [ -n "$line" ] && set -- "$@" --exclude "$line"
          done <<< "$CUPEL_EXCLUDE"
          set -- "$@" --push
          npx --yes "@cupel-sh/cli@${CUPEL_CLI_VERSION}" "$@"
